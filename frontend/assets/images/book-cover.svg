<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d7377"/>
      <stop offset="100%" style="stop-color:#14919b"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e8ecf1"/>
    </linearGradient>
  </defs>
  <!-- Book background -->
  <rect width="200" height="280" rx="8" fill="url(#bg)"/>
  <!-- Book spine shadow -->
  <rect x="0" y="0" width="16" height="280" rx="8" fill="rgba(0,0,0,0.15)"/>
  <!-- Page peek -->
  <rect x="20" y="30" width="160" height="220" rx="4" fill="url(#page)"/>
  <!-- Lines on page -->
  <rect x="36" y="60" width="110" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="36" y="76" width="90" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="36" y="92" width="100" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="36" y="108" width="80" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="36" y="124" width="95" height="4" rx="2" fill="#cbd5e1"/>
  <!-- Book icon -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="80" height="60" rx="4" fill="rgba(255,255,255,0.2)"/>
    <rect x="10" y="8" width="25" height="35" rx="2" fill="rgba(255,255,255,0.4)"/>
    <rect x="40" y="8" width="25" height="35" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="15" y="48" width="50" height="3" rx="1" fill="rgba(255,255,255,0.3)"/>
  </g>
  <!-- Bookmark -->
  <polygon points="150,0 170,0 170,50 160,40 150,50" fill="#f59e0b"/>
</svg>
