<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Book — Smart Library</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/badges.css">
</head>
<body>

  <div class="app-layout">

    <!-- sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span>📚</span>
        <span>Smart Library</span>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-menu-item">
          <a href="student-dashboard.html" class="sidebar-menu-link">
            <span>🏠</span><span>Home</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="student-mybooks.html" class="sidebar-menu-link">
            <span>📖</span><span>My Books</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <!-- active link for this page -->
          <a href="request-book.html" class="sidebar-menu-link active">
            <span>➕</span><span>Request Book</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="student-notifications.html" class="sidebar-menu-link">
            <span>🔔</span><span>Notifications</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="student_profile.html" class="sidebar-menu-link">
            <span>👤</span><span>Profile</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a class="sidebar-menu-link" style="cursor:pointer" onclick="logout()">
            <span>🚪</span><span>Logout</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- top bar -->
    <header class="top-bar">
      <h1 class="top-bar-title">Request a Book</h1>
      <div class="top-bar-actions">
        <div class="user-profile" style="cursor:pointer" title="View Profile" onclick="window.location.href='student_profile.html'">
          <div class="avatar" id="userAvatar">S</div>
          <span id="userName">student</span>
        </div>
      </div>
    </header>

    <!-- main content -->
    <main class="main-content">
      <div class="two-col">

        <!-- left: request form -->
        <section class="section">
          <h2 class="section-title">New Request</h2>

          <form id="requestForm" onsubmit="submitRequest(event)">

            <!-- book dropdown — only shows available books not already requested -->
            <div class="form-group">
              <label for="bookSelect">Select Book *</label>
              <select id="bookSelect" required onchange="updateBookInfo()">
                <option value="">Choose a Book</option>
              </select>
            </div>

            <!-- book info panel shown after selection -->
            <div id="bookInfo" style="display:none; margin-bottom:var(--spacing-md)">
              <div class="alert info">
                <div class="alert-content">
                  <p><strong>Title:</strong> <span id="infoTitle">-</span></p>
                  <p><strong>Author:</strong> <span id="infoAuthor">-</span></p>
                  <p><strong>Category:</strong> <span id="infoCategory">-</span></p>
                  <p><strong>Available Copies:</strong> <span id="infoAvailable">-</span></p>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-block">Submit Request</button>
          </form>
        </section>

        <!-- right: request history -->
        <section class="section">
          <h2 class="section-title">Your Requests</h2>

          <!-- request list — populated by request_book_student.js rendermyrequests() -->
          <div id="requestsContainer">
            <div class="empty-state">
              <div class="empty-state-icon">📋</div>
              <div class="empty-state-title">No Requests Yet</div>
              <p>request books to expand your reading list</p>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- toast -->
  <div class="toast" id="toast"></div>

  <script src="../js/utils/reminders.js"></script>

  <!--
    script load order:
    1. toast
    2. booksdata + initbooks — ensure books are in localstorage
    3. auth_student — redirect if not a logged-in student
    4. request_book_student — populatebookselect, updatebookinfo,
                              submitrequest, rendermyrequests, logout (new file)
    note: original loaded notifications.js and requests.js — neither existed.
          submitrequest and updatebookinfo were completely missing.
          also had no auth guard.
  -->
  <script src="../js/utils/toastNotifyFunction.js"></script>
  <script src="../js/api/config.js"></script>
  <script src="../js/utils/auth_student.js"></script>
  <script src="../js/request_book_student.js"></script>

</body>
</html>
