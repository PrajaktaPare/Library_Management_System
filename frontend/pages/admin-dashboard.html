<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Smart Library</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/badges.css">
</head>
<body>

  <div class="app-layout">

    <!-- sidebar navigation -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span>📚</span>
        <span>Smart Library</span>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-menu-item">
          <a href="admin-dashboard.html" class="sidebar-menu-link active">
            <span>📊</span><span>Dashboard</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="manage-books.html" class="sidebar-menu-link">
            <span>📖</span><span>Books</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="manage-users.html" class="sidebar-menu-link">
            <span>👥</span><span>Users</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="issue-book.html" class="sidebar-menu-link">
            <span>📤</span><span>Issues</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="view-requests.html" class="sidebar-menu-link">
            <span>🔔</span><span>Requests</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="admin_profile.html" class="sidebar-menu-link">
            <span>👤</span><span>Profile</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a class="sidebar-menu-link" style="cursor:pointer" onclick="logout()">
            <span>🚪</span><span>Logout</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- top bar -->
    <header class="top-bar">
      <h1 class="top-bar-title">Dashboard</h1>
      <div class="top-bar-actions">
        <div class="user-profile" style="cursor:pointer" title="View Profile" onclick="window.location.href='admin_profile.html'">
          <div class="avatar" id="userAvatar">A</div>
          <span id="userName">admin</span>
        </div>
      </div>
    </header>

    <!-- main content -->
    <main class="main-content">

      <!-- stat cards -->
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-number" id="totalMembers">0</div>
          <div class="stat-label">Members</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-number" id="totalBooks">0</div>
          <div class="stat-label">Books</div>
        </div>
        <div class="stat-card green">
          <div class="stat-number" id="issuedBooks">0</div>
          <div class="stat-label">Issued Books</div>
        </div>
        <div class="stat-card orange">
          <div class="stat-number" id="totalFines">0</div>
          <div class="stat-label">Fines (₹)</div>
        </div>
      </div>

     

      <!-- recent issues section -->
      <section class="section">
        <h2 class="section-title">Recent Issues</h2>
        <div id="recentIssuesContainer">
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <div class="empty-state-title">No Issues Yet</div>
            <p>book issues will appear here</p>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- toast notification -->
  <div class="toast" id="toast"></div>

  <!--
    script load order:
    1. toast — must be first so showtoast is available everywhere
    2. booksdata + initbooks — seed localstorage on first visit
    3. auth — redirect if not logged in as admin
    4. admin_dashboard — all dashboard logic
  -->
    <script src="../js/utils/fixIssuedBooks.js"></script>
<script src="../js/utils/toastNotifyFunction.js"></script>
  <script src="../js/api/config.js"></script>
  <script src="../js/utils/auth.js"></script>
  <script src="../js/admin_dashboard.js"></script>

</body>
</html>
