<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue Book — Smart Library</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/badges.css">
</head>
<body>

  <div class="app-layout">

    <!-- sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span>📚</span>
        <span>Smart Library</span>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-menu-item">
          <a href="admin-dashboard.html" class="sidebar-menu-link">
            <span>📊</span><span>Dashboard</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="manage-books.html" class="sidebar-menu-link">
            <span>📖</span><span>Books</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="manage-users.html" class="sidebar-menu-link">
            <span>👥</span><span>Users</span>
          </a>
        </li>
        
        <li class="sidebar-menu-item">
          <!-- active link for this page -->
          <a href="issue-book.html" class="sidebar-menu-link active">
            <span>📤</span><span>Issues</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="view-requests.html" class="sidebar-menu-link">
            <span>🔔</span><span>Requests</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="admin_profile.html" class="sidebar-menu-link">
            <span>👤</span><span>Profile</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a class="sidebar-menu-link" style="cursor:pointer" onclick="logout()">
            <span>🚪</span><span>Logout</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- top bar -->
    <header class="top-bar">
      <h1 class="top-bar-title">Book Issues</h1>
      <div class="top-bar-actions">
        <div class="user-profile" style="cursor:pointer" title="View Profile" onclick="window.location.href='admin_profile.html'">
          <div class="avatar" id="userAvatar">A</div>
          <span id="userName">admin</span>
        </div>
      </div>
    </header>

    <!-- main content -->
    <main class="main-content">
      <section class="section">

        <!-- Tab buttons for Active / Returned -->
        <div style="display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid #e5e7eb">
          <button class="issues-tab active" id="tabActive" onclick="switchIssuesTab('active')" style="padding:12px 24px;border:none;background:none;font-size:0.95rem;font-weight:600;color:var(--primary);border-bottom:2px solid var(--primary);margin-bottom:-2px;cursor:pointer;transition:all 0.2s">📤 Active Issues</button>
          <button class="issues-tab" id="tabReturned" onclick="switchIssuesTab('returned')" style="padding:12px 24px;border:none;background:none;font-size:0.95rem;font-weight:600;color:var(--text-light);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:all 0.2s">↩ Returned Books</button>
        </div>

        <!-- search bar -->
        <div class="filter-bar">
          <div class="search-bar" style="flex:1;position:relative">
            <span class="search-icon">🔍</span>
            <input type="text" id="issuesSearch" placeholder="Search by Book Title or Student..."
                   onkeyup="onIssuesSearch()">
            <button id="issuesSearchClear" onclick="clearIssuesSearch()"
                    style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-light);line-height:1">✕</button>
          </div>
        </div>

        <!-- issues table -->
        <table id="issuesTable">
          <thead>
            <tr>
              <th>Book Title</th>
              <th>Student</th>
              <th>Issue Date</th>
              <th>Due Date</th>
              <th>Status</th>
              <th>Fine (₹)</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="issuesTableBody">
            <tr><td colspan="7" class="text-center">Loading Issues...</td></tr>
          </tbody>
        </table>

        <!-- pagination -->
        <div id="issuesPagination" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--spacing-md)"></div>

      </section>
    </main>
  </div>

  

  <!-- toast -->
  <div class="toast" id="toast"></div>

  <!--
    script load order:
    1. toast
    2. booksdata + initbooks — seed localstorage
    3. auth — redirect if not admin
    4. adminnotifications — provides addnotification() used by issues.js
    5. admin_dashboard — provides logout() and handlestatisticsondashboard()
    6. issues — all issue/return logic
  -->
  <script src="../js/utils/toastNotifyFunction.js"></script>
  <script src="../js/api/config.js"></script>
  <script src="../js/utils/auth.js"></script>
  <script src="../js/admin_dashboard.js"></script>
  <script src="../js/issues.js"></script>

</body>
</html>
