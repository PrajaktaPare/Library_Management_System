<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Smart Library</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/badges.css">
  <style>
    * { box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, var(--primary-dark) 0%, #0a5f6f 50%, var(--background) 100%);
      background-image: 
        url('../assets/images/reading-illustration.jpg'),
        linear-gradient(135deg, var(--primary-dark) 0%, #0a5f6f 50%, var(--background) 100%);
      background-size: 40%, cover;
      background-position: center right, center;
      background-blend-mode: overlay;
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    .animated-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.1;
    }

    .circle-1 {
      width: 300px; height: 300px;
      background: white;
      top: -100px; right: -50px;
      animation: float 8s ease-in-out infinite;
    }

    .circle-2 {
      width: 200px; height: 200px;
      background: white;
      bottom: -50px; left: -30px;
      animation: float 10s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .reset-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--spacing-xl) var(--spacing-md);
    }

    .reset-form-wrapper {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-2xl);
      padding: var(--spacing-2xl);
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                  inset 0 1px 0 rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.8);
      animation: slide-in-form 0.6s ease-out;
    }

    @keyframes slide-in-form {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reset-header {
      text-align: center;
      margin-bottom: var(--spacing-2xl);
      animation: fade-up 0.8s ease-out 0.2s both;
    }

    .reset-header h2 {
      margin: 0 0 var(--spacing-sm) 0;
      color: var(--text-dark);
      font-size: 28px;
    }

    .reset-header p {
      color: var(--text-light);
      margin: 0;
      font-size: 14px;
    }

    .reset-form { width: 100%; animation: fade-up 0.8s ease-out 0.4s both; }

    .reset-form input {
      width: 100% !important;
      padding: 14px 16px !important;
      font-size: 15px !important;
      height: 50px !important;
      border: 2px solid #e5e5e5 !important;
      border-radius: var(--radius-lg) !important;
      transition: all 0.3s ease !important;
      font-family: inherit !important;
    }

    .reset-form input:focus {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 3px rgba(13, 115, 119, 0.1) !important;
    }

    .form-group { margin-bottom: var(--spacing-lg); }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 14px;
    }

    .reset-form .btn {
      margin-top: var(--spacing-lg) !important;
      height: 50px !important;
      font-size: 16px !important;
      font-weight: 600 !important;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%) !important;
      border: none !important;
      cursor: pointer;
      transition: all 0.3s ease !important;
      box-shadow: 0 4px 15px rgba(13, 115, 119, 0.3) !important;
      width: 100% !important;
    }

    .reset-form .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(13, 115, 119, 0.4) !important;
    }

    .login-link-container {
      text-align: center;
      margin-top: var(--spacing-lg);
      color: var(--text-light);
      animation: fade-up 0.8s ease-out 0.6s both;
    }

    .login-link-container a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .login-link-container a:hover { color: var(--primary-dark); }

    small { font-size: 12px; margin-top: 4px; display: block; }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .success-message {
      display: none;
      text-align: center;
      animation: fade-up 0.5s ease-out;
    }

    .success-icon { font-size: 64px; margin-bottom: 16px; }

    @media (max-width: 768px) {
      .reset-form-wrapper { max-width: 100%; }
      .reset-header h2 { font-size: 24px; }
    }
  </style>
</head>
<body>

  <!-- Animated background -->
  <div class="animated-bg">
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast"></div>

  <!-- Reset Password form -->
  <div class="reset-wrapper">
    <div class="reset-form-wrapper">

      <!-- Form view -->
      <div id="formView">
        <form class="reset-form" id="resetForm">
          <div class="reset-header">
            <h2>🔒 Reset Password</h2>
            <p>Enter your registered email and new password</p>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your registered email" autocomplete="email">
            <small id="emailError" style="color:red;display:none;"></small>
          </div>

          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password (min 8 chars)" autocomplete="new-password">
            <small id="newPasswordError" style="color:red;display:none;"></small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your new password" autocomplete="new-password">
            <small id="confirmPasswordError" style="color:red;display:none;"></small>
          </div>

          <button type="submit" class="btn btn-block">Reset Password</button>

          <div class="login-link-container">
            Remember your password? <a href="../index.html">Sign In</a>
          </div>
        </form>
      </div>

      <!-- Success view -->
      <div id="successView" class="success-message">
        <div class="success-icon">✅</div>
        <h2 style="color:var(--text-dark);margin:0 0 8px">Password Reset!</h2>
        <p style="color:var(--text-light);margin:0 0 24px">Your password has been changed successfully. A confirmation email has been sent.</p>
        <a href="../index.html" class="btn" style="display:inline-block;padding:14px 32px;text-decoration:none">Back to Login</a>
      </div>

    </div>
  </div>

  <script src="../js/utils/toastNotifyFunction.js"></script>
  <script src="../js/api/config.js"></script>
  <script>
    const resetForm = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");

    function validateEmail(e) { if (!e) return "Email is required"; if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return "Enter a valid email"; return "valid"; }
    function validatePassword(p) { if (!p) return "Password is required"; if (p.length < 8) return "Min 8 characters"; if (!/[A-Z]/.test(p)) return "Need uppercase"; if (!/[a-z]/.test(p)) return "Need lowercase"; if (!/[0-9]/.test(p)) return "Need number"; if (!/[@$!%*?&]/.test(p)) return "Need special char"; return "valid"; }
    function validateConfirm(p, c) { if (!c) return "Confirm password"; if (p !== c) return "Passwords don't match"; return "valid"; }

    function showErr(el, msg) { if (!el) return; el.textContent = msg !== "valid" ? msg : ""; el.style.display = msg !== "valid" ? "block" : "none"; }

    emailInput.addEventListener("input", () => showErr(document.getElementById("emailError"), validateEmail(emailInput.value.trim())));
    newPasswordInput.addEventListener("input", () => showErr(document.getElementById("newPasswordError"), validatePassword(newPasswordInput.value.trim())));
    confirmPasswordInput.addEventListener("input", () => showErr(document.getElementById("confirmPasswordError"), validateConfirm(newPasswordInput.value.trim(), confirmPasswordInput.value.trim())));

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const newPassword = newPasswordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      if (validateEmail(email) !== "valid") { showToast(validateEmail(email), "error"); return; }
      if (validatePassword(newPassword) !== "valid") { showToast(validatePassword(newPassword), "error"); return; }
      if (validateConfirm(newPassword, confirmPassword) !== "valid") { showToast(validateConfirm(newPassword, confirmPassword), "error"); return; }

      try {
        await apiClient.resetPassword(email, newPassword);
        document.getElementById("formView").style.display = "none";
        document.getElementById("successView").style.display = "block";
        showToast("Password reset successful!", "success");
      } catch (error) {
        showToast(error.message || "Failed to reset password", "error");
      }
    });
  </script>

</body>
</html>
