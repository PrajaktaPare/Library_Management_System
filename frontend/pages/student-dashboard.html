<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard — Smart Library</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/badges.css">
  <style>
    /* Book card grid — exactly 4 cards visible, equal sizing */
    #booksGrid {
      display: grid !important;
      grid-template-columns: repeat(4, 1fr) !important;
      gap: 20px !important;
      margin-top: 20px !important;
    }
    @media (max-width: 1200px) { #booksGrid { grid-template-columns: repeat(3, 1fr) !important; } }
    @media (max-width: 900px) { #booksGrid { grid-template-columns: repeat(2, 1fr) !important; } }
    @media (max-width: 560px) { #booksGrid { grid-template-columns: 1fr !important; } }

    .book-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #e8ecf1;
    }
    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.13);
    }

    /* Cover image — fixed height, uniform look */
    .book-card-cover {
      width: 100%;
      height: 220px;
      background: #f4f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid #eef0f4;
    }
    .book-card-cover img {
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      padding: 12px;
    }

    /* Card body — consistent padding and flex to push button to bottom */
    .book-card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .book-card-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-dark, #1a1a2e);
      margin: 0 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .book-card-author {
      font-size: 0.82rem;
      color: var(--text-light, #888);
      margin: 0 0 6px;
    }
    .book-card-category {
      font-size: 0.78rem;
      color: var(--primary, #0d7377);
      font-weight: 600;
      margin: 0 0 10px;
    }
    .book-card-availability {
      margin-bottom: 12px;
      margin-top: auto;
    }
    .book-card-availability .available {
      font-size: 0.82rem;
      color: #16a34a;
      font-weight: 600;
    }
    .book-card-availability .unavailable {
      font-size: 0.82rem;
      color: #dc2626;
      font-weight: 600;
    }
    .book-card-btn {
      width: 100%;
      font-size: 0.85rem !important;
      padding: 10px !important;
    }
    .book-card-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="app-layout">

    <!-- sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span>📚</span>
        <span>Smart Library</span>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-menu-item">
          <!-- active link for this page -->
          <a href="student-dashboard.html" class="sidebar-menu-link active">
            <span>🏠</span><span>Home</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="student-mybooks.html" class="sidebar-menu-link">
            <span>📖</span><span>My Books</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="request-book.html" class="sidebar-menu-link">
            <span>➕</span><span>Request Book</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="student-notifications.html" class="sidebar-menu-link">
            <span>🔔</span><span>Notifications</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="student_profile.html" class="sidebar-menu-link">
            <span>👤</span><span>Profile</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a class="sidebar-menu-link" style="cursor:pointer" onclick="logout()">
            <span>🚪</span><span>Logout</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- top bar -->
    <header class="top-bar">
      <h1 class="top-bar-title">Welcome to Library</h1>
      <div class="top-bar-actions">
        <div class="user-profile" style="cursor:pointer" title="View Profile" onclick="window.location.href='student_profile.html'">
          <div class="avatar" id="userAvatar">S</div>
          <span id="userName">student</span>
        </div>
      </div>
    </header>

    <!-- main content -->
    <main class="main-content">

      <!-- quick stat cards -->
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-number" id="booksIssued">0</div>
          <div class="stat-label">Books Issued</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-number" id="booksOverdue">0</div>
          <div class="stat-label">Overdue</div>
        </div>
        <div class="stat-card green">
          <div class="stat-number" id="booksPending">0</div>
          <div class="stat-label">Pending Requests</div>
        </div>
        <div class="stat-card orange">
          <div class="stat-number" id="totalFines">0</div>
          <div class="stat-label">Fines (₹)</div>
        </div>
      </div>

      <!-- browse books section -->
      <section class="section">
        <h2 class="section-title">Browse Books</h2>

        <!-- search and filter -->
        <div class="filter-bar">
          <div class="search-bar" style="flex:1;position:relative">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search by Title or Author..."
                   onkeyup="filterBooks()">
            <button id="searchClear" onclick="clearStudentSearch()"
                    style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-light);line-height:1">✕</button>
          </div>
          <div style="display:flex;align-items:center;gap:4px">
            <select id="categoryFilter" onchange="filterBooks()" style="min-width:160px">
              <option value="">All Categories</option>
              <option value="Competitive Exam">competitive exam</option>
              <option value="Academic">academic</option>
              <option value="Reading">reading</option>
            </select>
            <button id="categoryFilterClear" onclick="clearStudentCategory()"
                    style="display:none;background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-light);line-height:1;padding:0 4px">✕</button>
          </div>
        </div>

        <!-- books grid — populated by student_dashboard.js renderbooks() -->
        <div id="booksGrid">
          <!-- book cards injected here by js -->
        </div>

        <!-- pagination -->
        <div id="pagination" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:20px;justify-content:center"></div>

      </section>

    </main>

  </div>

  <!-- toast -->
  <div class="toast" id="toast"></div>

  <!--
    script load order:
    1. toast — must be first
    2. booksdata + initbooks — seed default books on first visit
    3. auth_student — redirect if not logged in as student
    4. student_dashboard — all dashboard logic (filterbooks, requestbook, logout are all here)
  -->
<script src="../js/utils/toastNotifyFunction.js"></script>
  <script src="../js/api/config.js"></script>
  <script src="../js/utils/auth_student.js"></script>
  <script src="../js/student_dashboard.js"></script>

</body>
</html>
