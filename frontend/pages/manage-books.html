<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Books — Smart Library</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/badges.css">
</head>
<body>

  <div class="app-layout">

    <!-- sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span>📚</span>
        <span>Smart Library</span>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-menu-item">
          <a href="admin-dashboard.html" class="sidebar-menu-link">
            <span>📊</span><span>Dashboard</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <!-- active link for this page -->
          <a href="manage-books.html" class="sidebar-menu-link active">
            <span>📖</span><span>Books</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="manage-users.html" class="sidebar-menu-link">
            <span>👥</span><span>Users</span>
          </a>
        </li>
       
        <li class="sidebar-menu-item">
          <a href="issue-book.html" class="sidebar-menu-link">
            <span>📤</span><span>Issues</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="view-requests.html" class="sidebar-menu-link">
            <span>🔔</span><span>Requests</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="admin_profile.html" class="sidebar-menu-link">
            <span>👤</span><span>Profile</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a class="sidebar-menu-link" style="cursor:pointer" onclick="logout()">
            <span>🚪</span><span>Logout</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- top bar -->
    <header class="top-bar">
      <h1 class="top-bar-title">Manage Books</h1>
      <div class="top-bar-actions">
        <button class="btn" onclick="openAddBookModal()">+ Add Book</button>
        <div class="user-profile" style="cursor:pointer" title="View Profile" onclick="window.location.href='admin_profile.html'">
          <div class="avatar" id="userAvatar">A</div>
          <span id="userName">admin</span>
        </div>
      </div>
    </header>

    <!-- main content -->
    <main class="main-content">
      <section class="section">

        <!-- search and filter bar -->
        <div class="filter-bar">
          <div class="search-bar" style="flex:1;position:relative">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search by Title, Author or ISBN..."
                   onkeyup="onBooksSearch()">
            <button id="searchClear" onclick="clearBooksSearch()"
                    style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-light);line-height:1">✕</button>
          </div>
          <div style="display:flex;align-items:center;gap:4px">
            <select id="categoryFilter" onchange="onCategoryFilterChange()" style="min-width:160px">
              <option value="">All Categories</option>
              <option value="Competitive Exam">Competitive Exam</option>
              <option value="Academic">Academic</option>
              <option value="Reading">Reading</option>
            </select>
            <button id="categoryFilterClear" onclick="clearCategoryFilter()"
                    style="display:none;background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-light);line-height:1;padding:0 4px">✕</button>
          </div>
        </div>

        <!-- books table -->
        <table id="booksTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Category</th>
              <th>Sub Category</th>
              <th>ISBN</th>
              <th>Total</th>
              <th>Available</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="booksTableBody">
            <tr><td colspan="8" class="text-center">Loading Books...</td></tr>
          </tbody>
        </table>

        <!-- pagination -->
        <div id="booksAdminPagination" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--spacing-md)"></div>

      </section>
    </main>
  </div>

  <!-- add / edit book modal -->
  <div class="modal" id="bookModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add Book</h2>
        <button class="modal-close" onclick="closeBookModal()">&times;</button>
      </div>
      <form id="bookForm" onsubmit="saveBook(event)">
        <div class="modal-body">
          <div class="form-group">
            <label>Title *</label>
            <input type="text" id="bookTitle" required placeholder="Book Title">
          </div>
          <div class="form-group">
            <label>Author *</label>
            <input type="text" id="bookAuthor" required placeholder="Author Name">
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="bookCategory" required>
              <option value="">Select Category</option>
              <option value="Competitive Exam">Competitive Exam</option>
              <option value="Academic">Academic</option>
              <option value="Reading">Reading</option>
            </select>
          </div>
          <div class="form-group">
            <label>Sub Category</label>
            <select id="bookSubCategory">
              <option value="">Select Sub Category</option>
              <option value="FY BCS">FY BCS</option>
              <option value="SY BCS">SY BCS</option>
              <option value="TY BCS">TY BCS</option>
              <option value="Aptitude">Aptitude</option>
              <option value="GK">GK</option>
              <option value="Reasoning">reasoning</option>
              <option value="Novel">novel</option>
              <option value="Biography">biography</option>
            </select>
          </div>
          <div class="form-group">
            <label>ISBN *</label>
            <input type="text" id="bookISBN" required placeholder="isbn number">
          </div>
          <div class="form-group">
            <label>Total Copies *</label>
            <input type="number" id="bookCopies" min="1" required placeholder="number of copies">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeBookModal()">Cancel</button>
          <button type="submit" class="btn">Save Book</button>
        </div>
      </form>
    </div>
  </div>

  <!-- toast -->
  <div id="toast" class="toast"></div>

  <!--
    script load order:
    1. toast
    2. booksdata + initbooks — seed localstorage
    3. auth — redirect if not admin
    4. admin_dashboard — provides logout()
    5. manage_books — all book crud logic
  -->
  <script src="../js/utils/toastNotifyFunction.js"></script>
  <script src="../js/api/config.js"></script>
  <script src="../js/utils/auth.js"></script>
  <script src="../js/admin_dashboard.js"></script>
  <script src="../js/manage_books.js"></script>

</body>
</html>
